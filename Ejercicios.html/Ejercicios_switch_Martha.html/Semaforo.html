<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El semaforo</title>
</head>
<body>
    <script>
        let color=prompt("Ingrese un color del semaforo");
        switch(color){
            case "rojo":
            document.write("Detente");
            break;
            case "amarilo":
            document.write("Preparate");
            break;
            case "verde":
            document.write("Avanza");
            break;
        default:
            document.write("No existe, vuelve a intentarlo");
        }
    </script>
</body>
</html>
