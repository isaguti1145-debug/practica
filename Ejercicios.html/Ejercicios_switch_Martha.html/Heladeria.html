<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La heladeria</title>
</head>
<body>
    <script>
        let opcion=parseInt(prompt("Ingrese del 1 al 3 para el sabor de helado que desea"));
        switch(opcion){
            case 1:
                document.write("Helado de vainilla servido");
                break;
            case 2:
                document.write("Helado de mani servido");
                break;
            case 3:
                document.write("Helado de maracuya servido");
                break;
        default:
            document.write("No valido, intenta del 1 al 3");

        }
    </script>
</body>
</html>
